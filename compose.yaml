# docker compose up -d → app + daily backups. HTTPS comes from your own Caddy
# container, which joins the ai-activity-proxy network. See AGENTS.md, "Deploy".
name: ai-activity

# Rotated logs (Docker keeps them forever otherwise): 3 × 10 MB per container.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    build: .
    # Built here by default; the deploy script sets the GHCR image in .env.
    image: ${APP_IMAGE:-ai-activity:latest}
    restart: unless-stopped
    logging: *logging
    init: true
    environment:
      # Only Caddy shares this network with the app: trust its forwarding
      # headers, so the login throttle sees real client addresses.
      TRUST_PROXY: ${PROXY_SUBNET:-172.29.94.0/24}
    volumes:
      - data:/data
    networks:
      proxy:
        aliases: [ai-activity] # Caddyfile: reverse_proxy ai-activity:3000
    # No published port: the app is only reachable through Caddy.

  # Daily backup of the live database into the same volume (data/backups),
  # pruned to 7 daily + 4 weekly. Copy them off the machine too.
  backup:
    image: ${APP_IMAGE:-ai-activity:latest}
    restart: unless-stopped
    logging: *logging
    init: true
    # Healthy means the app has opened (and created) the database.
    depends_on:
      app:
        condition: service_healthy
    network_mode: none
    # Not the image's check (it calls the web server, which never runs
    # here): `docker compose up --wait` needs every service healthy.
    healthcheck:
      test: ["CMD", "test", "-w", "/data"]
      interval: 10s
    volumes:
      - data:/data
    entrypoint: ["sh", "-c"]
    command:
      # A failed run is retried after 5 minutes, not the next day.
      - 'trap "exit 0" TERM INT; while :; do if node scripts/backup.ts; then s=${BACKUP_EVERY_SEC:-86400}; else echo "backup failed, retrying in 5 min"; s=300; fi; sleep $$s & wait $$!; done'

volumes:
  data:

networks:
  # Created here with a fixed name and subnet; your Caddy's compose file
  # lists it as external. Nothing but Caddy and the app may join it: every
  # address in it is trusted (TRUST_PROXY).
  proxy:
    name: ai-activity-proxy
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.29.94.0/24}
