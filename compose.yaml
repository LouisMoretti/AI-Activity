# docker compose up -d → Caddy (HTTPS) → app. See AGENTS.md, "Deploy".
# Settings come from .env next to this file (SITE_ADDRESS at least).
name: ai-activity

services:
  app:
    build: .
    image: ai-activity:latest
    restart: unless-stopped
    init: true
    environment:
      # Only Caddy shares this network with the app: trust its forwarding
      # headers, so the login throttle sees real client addresses.
      TRUST_PROXY: ${PROXY_SUBNET:-172.29.94.0/24}
    volumes:
      - data:/data
    networks: [proxy]
    # No published port: the app is only reachable through Caddy.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (your domain, or http://localhost with HTTP_PORT=8080 to try it)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep them across restarts
      - caddy_config:/config
    networks: [proxy]

  # Daily backup of the live database into the same volume (data/backups),
  # pruned to 7 daily + 4 weekly. Copy them off the machine too.
  backup:
    image: ai-activity:latest
    restart: unless-stopped
    init: true
    # Healthy means the app has opened (and created) the database.
    depends_on:
      app:
        condition: service_healthy
    network_mode: none
    volumes:
      - data:/data
    entrypoint: ["sh", "-c"]
    command:
      # A failed run is retried after 5 minutes, not the next day.
      - 'trap "exit 0" TERM INT; while :; do if node scripts/backup.ts; then s=${BACKUP_EVERY_SEC:-86400}; else echo "backup failed, retrying in 5 min"; s=300; fi; sleep $$s & wait $$!; done'

volumes:
  data:
  caddy_data:
  caddy_config:

networks:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.29.94.0/24}
