name: Bug report
description: Something shows the wrong value, breaks or fails.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, and where (page, card, collector, endpoint).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Tool and version, OS, browser, logs. Never paste device keys, prompts or transcripts.
