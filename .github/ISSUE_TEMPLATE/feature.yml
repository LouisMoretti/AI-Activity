name: Feature request
description: A new feature or a change to an existing one.
labels: [enhancement]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which parts of the project this touches (a maintainer adds the matching labels).
      multiple: true
      options:
        - ui
        - server
        - collectors
        - infra
        - security
        - documentation
        - accessibility
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Files, API routes or components involved, if known.
    validations:
      required: true
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Choices still to make (the issue then gets the "needs decision" label).
