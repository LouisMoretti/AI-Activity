name: Triage

# Issues: the forms add the type label (bug, enhancement, question); this adds
# the areas picked in the form, and asks for labels on an issue opened without
# any (the API and `gh issue create` skip the forms).
# Pull requests: each one must close an issue of this repo that has labels;
# the issue's type and area labels are copied onto the PR. A small fix
# (typo, flaky test, dependency bump) can skip that with the "no issue" label.
# The verdict is the "Linked issue" commit status, set on PR events and again
# when a linked issue's labels change (.github/scripts/triage.cjs).
# Each PR must also have an assignee: its author is assigned when it has none.
#
# pull_request_target (not pull_request) so PRs from forks can be labeled too.
# Safe because this workflow never checks out or runs the PR's code: checkout
# takes the base branch there.

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, assigned, unassigned]

permissions:
  contents: read

jobs:
  issue:
    name: Issue triage
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            await require("./.github/scripts/triage.cjs").onIssue({ github, context, core });

  linked-issue:
    name: Linked issue status
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            await require("./.github/scripts/triage.cjs").onPullRequest({ github, context, core });

  assignee:
    name: Assignee
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.assignees.length > 0) {
              core.info(`Assigned: ${pr.assignees.map((a) => a.login).join(", ")}`);
              return;
            }
            // GitHub silently ignores assignees who cannot be assigned
            // (not a collaborator, bots): check what it kept.
            const { data } = await github.rest.issues.addAssignees({
              ...context.repo, issue_number: pr.number, assignees: [pr.user.login],
            });
            if (data.assignees.length === 0) {
              core.setFailed(`Assign this PR to a collaborator (@${pr.user.login} cannot be assigned).`);
              return;
            }
            core.info(`Assigned the author, @${pr.user.login}.`);
