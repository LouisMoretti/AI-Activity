name: Triage

# Issues: the forms add the type label (bug, enhancement, question); this adds
# the areas picked in the form, and asks for labels on an issue opened without
# any (the API and `gh issue create` skip the forms).
# Pull requests: each one must close an issue of this repo that has labels;
# the issue's type and area labels are copied onto the PR.
#
# pull_request_target (not pull_request) so PRs from forks can be labeled too.
# Safe because this workflow never checks out or runs the PR's code.

on:
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  issue-labels:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const AREAS = ["ui", "server", "collectors", "infra", "security", "documentation", "accessibility"];
            const issue = context.payload.issue;
            // An issue form renders a dropdown as "### Area\n\nui, server".
            const match = /^### Area\s*\n+([^\n]+)/m.exec(issue.body ?? "");
            const picked = (match?.[1] ?? "").split(",").map((s) => s.trim()).filter((s) => AREAS.includes(s));
            const has = new Set(issue.labels.map((l) => l.name));
            const missing = picked.filter((name) => !has.has(name));
            if (missing.length) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: missing });
            }
            if (context.payload.action === "opened" && has.size === 0 && picked.length === 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: "This issue has no labels. Please add a type (`bug`, `enhancement`, `question`) and at least one area (" +
                  AREAS.map((a) => "`" + a + "`").join(", ") + "). A pull request can only close a labeled issue.",
              });
            }

  linked-issue:
    name: Linked issue
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Labels worth carrying over; triage labels stay on the issue.
            const COPY = ["bug", "enhancement", "documentation", "accessibility", "ui", "server", "collectors", "infra", "security"];
            const pr = context.payload.pull_request;
            const refs = [...(pr.body ?? "").matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi)]
              .map((m) => Number(m[1]));
            if (refs.length === 0) {
              core.setFailed("Open an issue first, then reference it in the PR description: \"Closes #<issue>\".");
              return;
            }
            const labels = new Set();
            for (const number of new Set(refs)) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number }));
              } catch {
                core.setFailed(`#${number} does not exist in this repository.`);
                return;
              }
              if (issue.pull_request) {
                core.setFailed(`#${number} is a pull request; reference an issue.`);
                return;
              }
              for (const l of issue.labels) if (COPY.includes(l.name)) labels.add(l.name);
            }
            if (labels.size === 0) {
              core.setFailed(`Label the linked issue first (a type and an area: ${COPY.join(", ")}).`);
              return;
            }
            const has = new Set(pr.labels.map((l) => l.name));
            const missing = [...labels].filter((name) => !has.has(name));
            if (missing.length) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: missing });
            }
            core.info(`Linked: ${refs.map((n) => "#" + n).join(", ")}; labels: ${[...labels].join(", ")}`);
