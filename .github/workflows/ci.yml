name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # arm64 too: better-sqlite3 is native, and the server may run on ARM.
    # The x64 job keeps the name "check": the main branch ruleset requires it.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, name: check }
          - { runner: ubuntu-24.04-arm, name: check (arm64) }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  docker:
    # The image builds and runs on both platforms (nothing is pushed).
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, name: docker }
          - { runner: ubuntu-24.04-arm, name: docker (arm64) }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t ai-activity:ci .
      - name: Smoke test the container
        run: |
          set -eu
          docker run -d --name app ai-activity:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' app | grep -qx healthy
          docker logs app | grep -q "Setup code:"
          echo "ci-password-123" | docker exec -i app node scripts/user.ts add ci
          docker exec app node scripts/gen-key.ts ci-device | grep -q "ak_"
          docker exec app node scripts/backup.ts | grep -q "integrity ok"
          docker stop app
          # A clean stop checkpoints the WAL: no -wal left with data in it.
          docker run --rm --volumes-from app --entrypoint sh ai-activity:ci -c '[ ! -s /data/dashboard.db-wal ]'
