name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # arm64 too: better-sqlite3 is native, and the server may run on ARM.
    # The x64 job keeps the name "check": the main branch ruleset requires
    # all four check names (check, check (arm64), docker, docker (arm64)).
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, name: check }
          - { runner: ubuntu-24.04-arm, name: check (arm64) }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  windows:
    # Every collector through its documented Windows command: msvcrt locks,
    # detached workers, agy.cmd, python instead of python3; and /install.ps1
    # through PowerShell. The server and
    # its other tests stay on the Linux jobs.
    name: collectors (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm run build
      - run: node --test test/collector.test.js test/codex-collector.test.js test/cursor-collector.test.js test/opencode-collector.test.js test/antigravity-collector.test.js test/install.test.js test/installed-collectors.test.js test/collector-versions.test.js
        env:
          PYTHON: python

  macos:
    # Exercise the documented /install.sh flow and every collector on macOS.
    # In particular, Codex must use --hook because macOS has no setsid.
    name: collectors (macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm run build
      - run: node --test --test-concurrency=1 test/collector.test.js test/codex-collector.test.js test/cursor-collector.test.js test/opencode-collector.test.js test/antigravity-collector.test.js test/install.test.js test/installed-collectors.test.js test/collector-versions.test.js
        env:
          PYTHON: python3

  docker:
    # The image builds and runs on both platforms (nothing is pushed).
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, name: docker }
          - { runner: ubuntu-24.04-arm, name: docker (arm64) }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config --quiet
      - run: docker build -t ai-activity:ci .
      - name: Smoke test the container
        run: |
          set -eu
          docker run -d --name app ai-activity:ci
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' app)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' app | grep -qx healthy
          docker logs app | grep -q "Setup code:"
          docker exec app node scripts/backup.ts | grep -q "integrity ok"
          docker stop app
          # A clean stop checkpoints the WAL: no -wal left with data in it.
          docker run --rm --volumes-from app --entrypoint sh ai-activity:ci -c '[ ! -s /data/dashboard.db-wal ]'
      - name: Smoke test a pull request preview
        run: bash test/preview-smoke.sh
